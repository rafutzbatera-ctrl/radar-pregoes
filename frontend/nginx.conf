server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: rotas de tela ("/", "/radar", ...) caem no index.html (sem 404).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API: proxy same-origin para o backend (api.js usa BASE="/api") — evita
    # CORS. O trailing slash no proxy_pass REMOVE o prefixo /api/:
    #   /api/pregoes -> http://backend:8000/pregoes
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # endpoints lentos (descobrir, resultados, RAG) batem item a item
        proxy_read_timeout 180s;
    }
}
